# =============================================================================
# Kubernetes — Sidecar Containers Demo
#
# Sidecar containers are declared alongside the main container in spec.containers[].
# All containers in the list share:
#   - The same network namespace → they call each other via localhost
#   - The same pod volumes → they share files through emptyDir mounts
#   - The same pod lifecycle → they start/stop together
#
# This pod runs three containers simultaneously:
#   1. main-app               — the Node.js REST API
#   2. sidecar-log-shipper    — tails app logs and ships them
#   3. sidecar-metrics-exporter — scrapes /metrics and exposes on port 9090
#
# Kubernetes 1.29+ also supports native sidecar containers via the
# initContainers field with restartPolicy: Always — see the note at the
# bottom of this file.
# =============================================================================

apiVersion: v1
kind: Pod
metadata:
  name: notes-app-sidecar-demo
  namespace: default
  labels:
    app: notes-app
    demo: sidecar-containers
  annotations:
    # Prometheus auto-discovery annotations
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
    description: "Demonstrates sidecar containers sharing network and volumes"
spec:
  volumes:
    - name: app-logs
      emptyDir: {}          # Shared between main-app (writer) and log-shipper (reader)
    - name: app-config
      emptyDir: {}          # Written by init, read by main-app

  initContainers:
    - name: init-config-generator
      image: nodejs-docker-containers/init-config-generator:latest
      imagePullPolicy: IfNotPresent
      env:
        - name: CONFIG_DIR
          value: /etc/app-config
        - name: APP_ENV
          value: production
      volumeMounts:
        - name: app-config
          mountPath: /etc/app-config

    - name: init-db-migrator
      image: nodejs-docker-containers/init-db-migrator:latest
      imagePullPolicy: IfNotPresent
      env:
        - name: DB_HOST
          value: postgres-service
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: password

  containers:

    # ── Container 1: Main Application ────────────────────────────────────────
    - name: main-app
      image: nodejs-docker-containers/main-app:latest
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 3000
          name: http
      env:
        - name: PORT
          value: "3000"
        - name: DB_HOST
          value: postgres-service
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: password
        - name: LOG_DIR
          value: /var/log/app
        - name: CONFIG_DIR
          value: /etc/app-config
      volumeMounts:
        - name: app-logs
          mountPath: /var/log/app
        - name: app-config
          mountPath: /etc/app-config
          readOnly: true
      readinessProbe:
        httpGet:
          path: /health
          port: 3000
        initialDelaySeconds: 5
        periodSeconds: 10
      resources:
        requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "256Mi"
          cpu: "500m"

    # ── Container 2: Log Shipper Sidecar ─────────────────────────────────────
    # Shares /var/log/app volume with main-app.
    # In production this would forward to Elasticsearch, Loki, Datadog, etc.
    - name: sidecar-log-shipper
      image: nodejs-docker-containers/sidecar-log-shipper:latest
      imagePullPolicy: IfNotPresent
      env:
        - name: LOG_DIR
          value: /var/log/app
        - name: SERVICE_NAME
          value: main-app
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name   # Use pod name as host label
      volumeMounts:
        - name: app-logs
          mountPath: /var/log/app        # Same mount as main-app — shared file access
      resources:
        requests:
          memory: "32Mi"
          cpu: "10m"
        limits:
          memory: "64Mi"
          cpu: "50m"

    # ── Container 3: Metrics Exporter Sidecar ────────────────────────────────
    # Calls localhost:3000/metrics (same network namespace as main-app).
    # Exposes enriched metrics on port 9090 for Prometheus to scrape.
    - name: sidecar-metrics-exporter
      image: nodejs-docker-containers/sidecar-metrics-exporter:latest
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 9090
          name: metrics
      env:
        - name: MAIN_APP_HOST
          value: localhost               # Same pod = same network namespace
        - name: MAIN_APP_PORT
          value: "3000"
        - name: EXPORTER_PORT
          value: "9090"
        - name: SCRAPE_INTERVAL_MS
          value: "5000"
        - name: SERVICE_NAME
          value: main-app
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
      readinessProbe:
        httpGet:
          path: /health
          port: 9090
        initialDelaySeconds: 10
        periodSeconds: 15
      resources:
        requests:
          memory: "32Mi"
          cpu: "10m"
        limits:
          memory: "64Mi"
          cpu: "50m"

---
# Service to expose main-app HTTP and metrics-exporter
apiVersion: v1
kind: Service
metadata:
  name: notes-app-service
  namespace: default
  labels:
    app: notes-app
spec:
  selector:
    app: notes-app
  ports:
    - name: http
      port: 80
      targetPort: 3000
    - name: metrics
      port: 9090
      targetPort: 9090

# =============================================================================
# Kubernetes 1.29+ Native Sidecar Pattern (using initContainers + restartPolicy)
#
# Starting in Kubernetes 1.29, you can declare a sidecar that starts before
# the main container and restarts alongside it using:
#
#   initContainers:
#     - name: sidecar-log-shipper
#       restartPolicy: Always        # <-- this makes it a "sidecar init container"
#       image: ...
#
# Benefits over the containers[] approach:
#   - Sidecar starts before main container (useful for proxies)
#   - Sidecar terminates after main container (proper shutdown order)
#   - Shown in kubectl logs / describe as a sidecar container
#
# The containers[] approach used above works on all Kubernetes versions.
# =============================================================================
