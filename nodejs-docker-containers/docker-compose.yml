# =============================================================================
# Docker Compose — Node.js Docker Container Patterns Demo
#
# This file demonstrates two fundamental container patterns:
#
# INIT CONTAINERS (services that run to completion before the main app):
#   init-config-generator  →  writes config to shared volume
#   init-db-migrator       →  waits for Postgres, runs migrations, seeds data
#
# SIDECAR CONTAINERS (services that run alongside the main app):
#   sidecar-log-shipper    →  tails main app logs, enriches and ships them
#   sidecar-metrics-exporter → scrapes /metrics, exposes Prometheus endpoint + dashboard
#
# Startup order:
#   postgres (healthy) ──┐
#   init-config-generator ──┤
#                           ├──► init-db-migrator ──► main-app ──► sidecars
#
# Note: Docker Compose approximates init containers using
#       depends_on.condition: service_completed_successfully
# =============================================================================

services:

  # ── Infrastructure ─────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notesdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notesdb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Init Containers ─────────────────────────────────────────────────────────
  # These run once and exit (service_completed_successfully) before main-app starts.

  init-config-generator:
    build:
      context: ./apps/init-config-generator
      dockerfile: Dockerfile
    environment:
      CONFIG_DIR: /etc/app-config
      APP_ENV: development
      APP_VERSION: "1.0.0"
      FEATURE_FLAGS: "notes-delete,notes-tags,dark-mode"
      DB_HOST: postgres
    volumes:
      - app-config:/etc/app-config
    # No depends_on needed — config generation is independent of the database

  init-db-migrator:
    build:
      context: ./apps/init-db-migrator
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: notesdb
      DB_USER: postgres
      DB_PASSWORD: postgres
      MAX_RETRIES: "30"
      RETRY_INTERVAL_MS: "2000"
    depends_on:
      postgres:
        condition: service_healthy
      init-config-generator:
        condition: service_completed_successfully

  # ── Main Application ─────────────────────────────────────────────────────────

  main-app:
    build:
      context: ./apps/main-app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: notesdb
      DB_USER: postgres
      DB_PASSWORD: postgres
      LOG_DIR: /var/log/app
      CONFIG_DIR: /etc/app-config
    volumes:
      - app-logs:/var/log/app
      - app-config:/etc/app-config:ro  # read-only — written by init-config-generator
    depends_on:
      postgres:
        condition: service_healthy
      init-db-migrator:
        condition: service_completed_successfully
      init-config-generator:
        condition: service_completed_successfully

  # ── Sidecar Containers ───────────────────────────────────────────────────────
  # These run alongside main-app, sharing volumes and the same compose network.
  # In Kubernetes they would share the same pod (same network namespace).

  sidecar-log-shipper:
    build:
      context: ./apps/sidecar-log-shipper
      dockerfile: Dockerfile
    environment:
      LOG_DIR: /var/log/app
      SERVICE_NAME: main-app
      POLL_INTERVAL_MS: "500"
    volumes:
      - app-logs:/var/log/app  # shared with main-app
    depends_on:
      main-app:
        condition: service_healthy
    restart: unless-stopped

  sidecar-metrics-exporter:
    build:
      context: ./apps/sidecar-metrics-exporter
      dockerfile: Dockerfile
    ports:
      - "9090:9090"  # Prometheus scrape endpoint
    environment:
      MAIN_APP_HOST: main-app   # In K8s this would be localhost (same pod)
      MAIN_APP_PORT: "3000"
      EXPORTER_PORT: "9090"
      SCRAPE_INTERVAL_MS: "5000"
      SERVICE_NAME: main-app
    depends_on:
      main-app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  app-logs:       # shared between main-app and sidecar-log-shipper
  app-config:     # written by init-config-generator, read by main-app
